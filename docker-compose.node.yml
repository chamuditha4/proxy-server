# Self-contained proxy NODE — pulls the published image, builds nothing.
# Copy just THIS file + a .env to any server with Docker, then:
#   docker compose -f docker-compose.node.yml up -d
name: proxy-node

services:
  netbird:
    image: netbirdio/netbird:latest
    hostname: "proxy-${NODE_NAME:?set NODE_NAME, e.g. de-1}"
    cap_add: [NET_ADMIN, SYS_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    environment:
      NB_SETUP_KEY: "${NB_SETUP_KEY:?set NB_SETUP_KEY (your proxy-nodes key)}"
      NB_MANAGEMENT_URL: "${NB_MANAGEMENT_URL:-https://api.netbird.io}"
    volumes:
      - netbird-state:/var/lib/netbird
    restart: always

  proxy:
    image: twozerotwo/proxy-node:1.0.0     # <-- pulled from Docker Hub, no build
    network_mode: "service:netbird"
    depends_on: [netbird]
    environment:
      PROXY_PORT: "${PROXY_PORT:-8899}"
      PROXY_USER: ""
      PROXY_PASS: ""
    restart: always

volumes:
  netbird-state:
